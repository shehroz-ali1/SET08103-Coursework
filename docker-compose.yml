version: '3.8'
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: world
    volumes:
      - ./world.sql:/docker-entrypoint-initdb.d/world.sql
    ports:
      - "33060:3306"

  app:
    build: .
    depends_on:
      - db
    environment:
      - DB_URL=jdbc:mysql://db:3306/world?useSSL=false&allowPublicKeyRetrieval=true
      - DB_USER=root
      - DB_PASS=password